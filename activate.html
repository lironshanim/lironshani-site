<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>הפעלת טופס</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#fff;color:#0B1F3F;max-width:460px;margin:40px auto;padding:0 20px;line-height:1.6}
h1{font-size:1.4rem;border-bottom:3px solid #C9A24B;padding-bottom:8px}
label{display:block;margin:14px 0 4px;font-weight:700}
input,textarea{width:100%;box-sizing:border-box;padding:10px;font-size:1rem;border:1px solid #B9C0CF;border-radius:6px}
button{margin-top:18px;background:#C9A24B;color:#0B1F3F;border:0;border-radius:6px;padding:12px 26px;font-size:1rem;font-weight:700;cursor:pointer}
small{display:block;margin-top:18px;color:#5b6478}
</style>
</head>
<body>
<h1>הפעלת הטופס (חד-פעמי)</h1>
<form action="https://formsubmit.co/lironshanim@gmail.com" method="POST">
<input type="hidden" name="_subject" value="הפעלת טופס האתר">
<label for="n">שם</label><input id="n" name="שם" value="בדיקה">
<label for="t">טלפון</label><input id="t" name="טלפון" value="0500000000">
<label for="m">הודעה</label><textarea id="m" name="הודעה" rows="3">הודעת בדיקה להפעלת הטופס</textarea>
<button type="submit">שליחה</button>
</form>
<small>עמוד זה נועד להפעלה חד-פעמית של הטופס. לאחר ההפעלה יש למחוק אותו מהמאגר.</small>
</body>
</html>
